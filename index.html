<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Web RPG Maker Editor</title>
    <link rel="stylesheet" href="style.css">
    <!-- test2 -->
</head>

<body>
    <div id="editor-container">
        <header id="toolbar">
            <div class="tool-group">
                <button id="btn-save">프로젝트 저장</button>
            </div>
            <div class="tool-group" style="margin-left: auto;">
                <button id="btn-run-game">게임 실행</button>
            </div>
        </header>

        <main id="workspace">
            <aside id="side-panel">
                <section id="tileset-window">
                    <div class="panel-header">타일셋 뷰</div>
                    <div id="tileset-view-container">
                        <canvas id="tileset-canvas"></canvas>
                        <div id="tileset-selection-rect"></div>
                    </div>
                    <div class="tileset-tabs">
                        <button class="tab-btn active" data-tab="A">A</button>
                        <button class="tab-btn" data-tab="B">B</button>
                        <button class="tab-btn" data-tab="C">C</button>
                        <button class="tab-btn" data-tab="D">D</button>
                        <button class="tab-btn" data-tab="E">E</button>
                        <button class="tab-btn" data-tab="R">R</button>
                    </div>
                    <div class="layer-select-container">
                        <div class="layer-buttons">
                            <button class="layer-btn active" data-layer="auto">자동</button>
                            <button class="layer-btn" data-layer="0">1</button>
                            <button class="layer-btn" data-layer="1">2</button>
                            <button class="layer-btn" data-layer="2">3</button>
                            <button class="layer-btn" data-layer="3">4</button>
                        </div>
                        <div class="tool-buttons" style="display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap;">
                            <button class="tool-btn active" data-tool="pen" title="펜 (타일 그리기)" style="flex: 1; min-width: 40px;">🖊️</button>
                            <button class="tool-btn" data-tool="eraser" title="지우개 (타일 삭제)" style="flex: 1; min-width: 40px;">🧹</button>
                            <button class="tool-btn" data-tool="rect" title="사각형 (드래그하여 사각형 채우기)" style="flex: 1; min-width: 40px;">▭</button>
                            <button class="tool-btn" data-tool="reset-zoom" title="1:1 (확대/축소 초기화)" style="flex: 1; min-width: 40px;">🔍</button>
                        </div>
                    </div>
                </section>

                <div id="tileset-map-resizer" class="tileset-map-resizer"></div>

                <section id="map-management">
                    <div id="map-tree">
                        <div class="panel-header">맵 목록</div>
                        <ul id="map-list">
                        </ul>
                    </div>
                </section>
            </aside>

            <section id="map-editor">
                <!-- 데이터베이스 토글 버튼 -->
                <div id="database-toggle-container">
                    <button id="database-toggle-btn" title="데이터베이스 열기/닫기">⚙️</button>
                </div>
                
                <!-- 데이터베이스 창 -->
                <div id="database-panel" style="display: none;">
                    <!-- 탭 헤더 -->
                    <div id="database-tabs">
                        <button class="db-tab active" data-tab="resources">리소스</button>
                        <button class="db-tab" data-tab="actors">액터</button>
                        <button class="db-tab" data-tab="items">아이템</button>
                        <button class="db-tab" data-tab="animations">애니메이션</button>
                        <button class="db-tab" data-tab="tilesets">타일셋</button>
                        <button class="db-tab" data-tab="commonevents">공통이벤트</button>
                        <button class="db-tab" data-tab="system">시스템</button>
                    </div>
                    
                    <!-- 탭 컨텐츠 -->
                    <div id="database-content">
                        <!-- 리소스 탭 -->
                        <div class="db-tab-content active" id="db-resources">
                            <div class="db-tab-panel" style="display: flex; flex-direction: column; height: 100%;">
                                <h3>리소스 관리</h3>
                                
                                <!-- 서브탭 버튼 -->
                                <div class="resource-subtabs">
                                    <button class="resource-subtab active" data-subtab="images">이미지</button>
                                    <button class="resource-subtab" data-subtab="audio">오디오</button>
                                    <button class="resource-subtab" data-subtab="plugins">플러그인</button>
                                </div>
                                
                                <!-- 이미지 서브탭 -->
                                <div class="resource-subtab-content active" id="resource-images">
                                    <div class="resource-toolbar">
                                        <button class="resource-btn" id="btn-import-image">가져오기</button>
                                        <button class="resource-btn" id="btn-delete-image">삭제</button>
                                    </div>
                                    <div class="resource-content-area">
                                        <!-- 왼쪽: 폴더 목록 -->
                                        <div class="resource-folder-list">
                                            <div class="resource-section-title">폴더</div>
                                            <div id="image-folders-list" class="folder-items"></div>
                                        </div>
                                        <!-- 중간: 이미지 목록 -->
                                        <div class="resource-file-list">
                                            <div class="resource-section-title">파일</div>
                                            <div id="image-files-list" class="file-items"></div>
                                        </div>
                                        <!-- 오른쪽: 미리보기 -->
                                        <div class="resource-preview">
                                            <div class="resource-section-title">미리보기</div>
                                            <div id="image-preview-area" class="preview-area">
                                                <div class="preview-empty">이미지를 선택하세요</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- 오디오 서브탭 -->
                                <div class="resource-subtab-content" id="resource-audio">
                                    <div class="resource-toolbar">
                                        <button class="resource-btn" id="btn-import-audio">가져오기</button>
                                        <button class="resource-btn" id="btn-delete-audio">삭제</button>
                                    </div>
                                    <div class="resource-content-area">
                                        <!-- 왼쪽: 오디오 타입 버튼 -->
                                        <div class="audio-type-buttons">
                                            <button class="audio-type-btn active" data-type="bgm">BGM</button>
                                            <button class="audio-type-btn" data-type="bgs">BGS</button>
                                            <button class="audio-type-btn" data-type="me">ME</button>
                                            <button class="audio-type-btn" data-type="se">SE</button>
                                        </div>
                                        <!-- 중간: 오디오 파일 목록 -->
                                        <div class="audio-file-list">
                                            <div class="resource-section-title">파일 목록</div>
                                            <div id="audio-files-list" class="file-items"></div>
                                        </div>
                                        <!-- 오른쪽: 재생 컨트롤 -->
                                        <div class="audio-controls">
                                            <div class="resource-section-title">재생</div>
                                            <div class="audio-control-area">
                                                <div id="audio-selected-name" class="audio-selected-name">선택된 파일 없음</div>
                                                <button class="audio-control-btn" id="btn-play-audio">▶ 재생</button>
                                                <button class="audio-control-btn" id="btn-stop-audio">■ 정지</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- 플러그인 서브탭 -->
                                <div class="resource-subtab-content" id="resource-plugins">
                                    <div class="resource-toolbar">
                                        <button class="resource-btn" id="btn-import-plugin">가져오기</button>
                                        <button class="resource-btn" id="btn-delete-plugin">삭제</button>
                                    </div>
                                    <div class="resource-content-area">
                                        <div class="plugin-list-container">
                                            <div class="resource-section-title">활성화된 플러그인</div>
                                            <div id="plugins-list" class="plugin-items"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 액터 탭 -->
                        <div class="db-tab-content" id="db-actors">
                            <div class="db-tab-panel">
                                <h3>액터</h3>
                                <div id="db-actors-list" class="db-list"></div>
                            </div>
                        </div>
                        
                        <!-- 아이템 탭 -->
                        <div class="db-tab-content" id="db-items">
                            <div class="db-tab-panel">
                                <h3>아이템</h3>
                                <div id="db-items-list" class="db-list"></div>
                            </div>
                        </div>
                        
                        <!-- 애니메이션 탭 -->
                        <div class="db-tab-content" id="db-animations">
                            <div class="db-tab-panel">
                                <h3>애니메이션</h3>
                                <div id="db-animations-list" class="db-list"></div>
                            </div>
                        </div>
                        
                        <!-- 타일셋 탭 -->
                        <div class="db-tab-content" id="db-tilesets">
                            <div class="db-tab-panel">
                                <h3>타일셋</h3>
                                <div id="db-tilesets-list" class="db-list"></div>
                            </div>
                        </div>
                        
                        <!-- 공통이벤트 탭 -->
                        <div class="db-tab-content" id="db-commonevents">
                            <div class="db-tab-panel" style="display: flex; gap: 10px; height: 100%;">
                                <!-- 왼쪽: 공통이벤트 리스트 -->
                                <div style="flex: 0 0 300px; display: flex; flex-direction: column;">
                                    <h3>공통 이벤트</h3>
                                    <div id="db-commonevents-list" class="db-list" style="flex: 1; overflow-y: auto;"></div>
                                </div>
                                <!-- 오른쪽: 이벤트 코드 -->
                                <div style="flex: 1; display: flex; flex-direction: column;">
                                    <h3>실행 내용</h3>
                                    <div id="db-commonevent-commands" style="flex: 1; background: #1a1a1a; border: 1px solid #444; border-radius: 2px; overflow-y: auto; padding: 6px; font-family: 'Courier New', monospace; font-size: 11px;">
                                        <p style="color: #666; text-align: center; margin-top: 20px;">공통이벤트를 선택하세요</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 시스템 탭 -->
                        <div class="db-tab-content" id="db-system">
                            <div class="db-tab-panel">
                                <h3>시스템</h3>
                                <div class="db-section">
                                    <label>게임 제목</label>
                                    <input type="text" id="db-game-title" class="db-input">
                                </div>
                                <div class="db-section">
                                    <label>스위치 목록</label>
                                    <div id="db-switches-list" class="db-list"></div>
                                </div>
                                <div class="db-section">
                                    <label>변수 목록</label>
                                    <div id="db-variables-list" class="db-list"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="database-close-container">
                        <button id="database-close-btn" title="닫기">▼ 닫기</button>
                    </div>
                </div>
                
                <div id="map-grid-container">
                    <canvas id="map-canvas"></canvas>
                    <canvas id="map-overlay-canvas"
                        style="position: absolute; left: 0; top: 0; pointer-events: none; z-index: 10;"></canvas>
                    <canvas id="event-overlay-canvas"
                        style="position: absolute; left: 0; top: 0; pointer-events: none; z-index: 100;"></canvas>
                </div>
            </section>

            <aside id="inspector-panel">
                <div id="inspector-resizer" class="inspector-resizer"></div>
                <div class="panel-header">이벤트 인스펙터</div>

                <div id="inspector-empty" class="inspector-content">
                    <p class="empty-msg">편집할 이벤트를 선택하세요.</p>
                </div>

                <div id="inspector-main" class="inspector-content" style="display: none;">
                    <!-- 최상단: 이벤트 정보 -->
                    <section class="ins-section" style="display: flex; gap: 8px; margin-bottom: 12px;">
                        <div class="ins-row" style="flex: 1;">
                            <label>이름</label>
                            <input type="text" id="ins-name" placeholder="이벤트 이름">
                        </div>
                        <div class="ins-row" style="flex: 1;">
                            <label>노트</label>
                            <input type="text" id="ins-note" placeholder="이벤트 노트">
                        </div>
                    </section>

                    <!-- 버튼 그룹 -->
                    <div class="ins-button-group">
                        <button class="ins-btn" id="ins-btn-new">새로 만들기</button>
                        <button class="ins-btn" id="ins-btn-copy">복사</button>
                        <button class="ins-btn" id="ins-btn-paste">붙여넣기</button>
                        <button class="ins-btn" id="ins-btn-delete">삭제</button>
                        <button class="ins-btn" id="ins-btn-clear">비우기</button>
                    </div>
                        <div id="ins-page-tab-container" style="display: flex; gap: 2px; overflow-x: auto; padding-bottom: 4px;"></div>

                    <!-- 페이지 탭 -->
                    <div class="ins-tabs" style="display: flex; background: #333;">
                        <button class="ins-page-tab active" data-tab="setting" style="flex: 1;">페이지 설정</button>
                        <button class="ins-page-tab" data-tab="commands" style="flex: 1;">실행 내용</button>
                    </div>

                    <!-- 페이지 내용 -->
                    <div id="ins-page-content"
                        style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">

                        <!-- 페이지 설정 탭 내용 -->
                        <div id="ins-setting-content" class="ins-tab-content"
                            style="display: flex; flex-direction: column; flex: 1; overflow-y: auto;">

                            <!-- 조건 섹션 (맨 위) -->
                            <section class="ins-section">
                                <div class="ins-label">조건</div>
                                <div id="ins-switch-container" style="display: flex; gap: 12px; margin-bottom: 8px;">
                                    <!-- 스위치 필드가 여기에 동적으로 추가됨 -->
                                </div>
                                <div style="display: flex; gap: 12px;">
                                    <div class="ins-row" style="flex: 1;">
                                        <label style="display: flex; align-items: center; gap: 4px;">
                                            <input type="checkbox" id="ins-self-switch-check" style="cursor: pointer;">
                                            셀프 스위치
                                        </label>
                                        <select id="ins-self-switch"
                                            style="width: 100%; padding: 4px; font-size: 11px;">
                                            <option value="A">A</option>
                                            <option value="B">B</option>
                                            <option value="C">C</option>
                                            <option value="D">D</option>
                                        </select>
                                    </div>
                                    <div class="ins-row" style="flex: 1;">
                                        <label style="display: flex; align-items: center; gap: 4px;">
                                            <input type="checkbox" id="ins-variable-check" style="cursor: pointer;">
                                            변수
                                        </label>
                                        <button id="ins-variable-selector" class="ins-selector-btn" style="width: 100%; padding: 6px; font-size: 11px; margin-top: 4px; text-align: left;">선택</button>
                                        <div style="display: flex; gap: 4px; margin-top: 4px;">
                                            <input type="number" id="ins-variable-value" placeholder="값"
                                                style="flex: 1; padding: 4px; font-size: 11px;">
                                        </div>
                                        <span id="ins-variable-name" style="font-size: 10px; color: #999; margin-top: 4px; display: block;"></span>
                                    </div>
                                </div>
                            </section>

                            <!-- 이미지와 옵션 (가로 배치) -->
                            <div style="display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start;">
                                <!-- 이미지 섹션 (왼쪽) -->
                                <section class="ins-section" style="flex: 0 0 auto; display: flex; flex-direction: column;">
                                    <div class="ins-label">이미지</div>
                                    <div id="ins-preview"
                                        style="display: flex; justify-content: center; align-items: center; background: #1a1a1a; border: 1px solid #444; border-radius: 4px; width: 120px; height: 120px; flex-shrink: 0;">
                                    </div>
                                </section>

                                <!-- 옵션 섹션 (오른쪽) -->
                                <section class="ins-section" style="flex: 1; display: flex; flex-direction: column;">
                                    <div class="ins-label">옵션</div>
                                    <div style="overflow-y: auto; flex: 1;">
                                        <div class="ins-row"
                                            style="flex-direction: row; justify-content: space-between; align-items: center;">
                                            <label>보행 움직임</label>
                                            <button id="ins-walk-anime" class="ins-toggle-btn" data-setting="walkAnime"
                                                style="width: 50px; padding: 4px; background: #1a1a1a; border: 1px solid #555; border-radius: 2px; color: #fff; cursor: pointer; font-size: 11px;">OFF</button>
                                        </div>
                                        <div class="ins-row"
                                            style="flex-direction: row; justify-content: space-between; align-items: center;">
                                            <label>제자리 움직임</label>
                                            <button id="ins-step-anime" class="ins-toggle-btn" data-setting="stepAnime"
                                                style="width: 50px; padding: 4px; background: #1a1a1a; border: 1px solid #555; border-radius: 2px; color: #fff; cursor: pointer; font-size: 11px;">OFF</button>
                                        </div>
                                        <div class="ins-row"
                                            style="flex-direction: row; justify-content: space-between; align-items: center;">
                                            <label>방향 고정</label>
                                            <button id="ins-dir-fix" class="ins-toggle-btn" data-setting="directionFix"
                                                style="width: 50px; padding: 4px; background: #1a1a1a; border: 1px solid #555; border-radius: 2px; color: #fff; cursor: pointer; font-size: 11px;">OFF</button>
                                        </div>
                                        <div class="ins-row"
                                            style="flex-direction: row; justify-content: space-between; align-items: center;">
                                            <label>통과</label>
                                            <button id="ins-through" class="ins-toggle-btn" data-setting="through"
                                                style="width: 50px; padding: 4px; background: #1a1a1a; border: 1px solid #555; border-radius: 2px; color: #fff; cursor: pointer; font-size: 11px;">OFF</button>
                                        </div>
                                    </div>
                                </section>
                            </div>

                            <!-- 우선권과 발동 (한 행) -->
                            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                                <div class="ins-row" style="flex: 1;">
                                    <label>우선권</label>
                                    <select id="ins-priority" style="width: 100%; padding: 4px; font-size: 11px;">
                                        <option value="0">아래</option>
                                        <option value="1">동일</option>
                                        <option value="2">위</option>
                                    </select>
                                </div>
                                <div class="ins-row" style="flex: 1;">
                                    <label>발동</label>
                                    <select id="ins-trigger" style="width: 100%; padding: 4px; font-size: 11px;">
                                        <option value="0">결정키</option>
                                        <option value="1">플레이어 접근</option>
                                        <option value="2">이벤트 접근</option>
                                        <option value="3">자동</option>
                                        <option value="4">병렬</option>
                                    </select>
                                </div>
                            </div>

                            <!-- 이동 설정 (한 행) -->
                            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                                <div class="ins-row" style="flex: 1;">
                                    <label>타입</label>
                                    <select id="ins-move-type" style="width: 100%; padding: 4px; font-size: 11px;">
                                        <option value="0">고정</option>
                                        <option value="1">랜덤</option>
                                        <option value="2">접근</option>
                                        <option value="3">커스텀</option>
                                    </select>
                                </div>
                                <div class="ins-row" style="flex: 1;">
                                    <label>이동 루트</label>
                                    <button id="ins-move-route-btn" style="width: 100%; padding: 4px; background: #3a3a3a; border: 1px solid #555; border-radius: 2px; color: #fff; cursor: pointer; font-size: 11px;">설정</button>
                                </div>
                                <div class="ins-row" style="flex: 1;">
                                    <label>속도</label>
                                    <select id="ins-move-speed" style="width: 100%; padding: 4px; font-size: 11px;">
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="6">6</option>
                                    </select>
                                </div>
                                <div class="ins-row" style="flex: 1;">
                                    <label>빈도</label>
                                    <select id="ins-move-freq" style="width: 100%; padding: 4px; font-size: 11px;">
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- 실행 내용 탭 (별도) -->
                        <div id="ins-commands-content" class="ins-tab-content"
                            style="display: none; flex-direction: column; flex: 1; overflow: hidden;">
                            <section class="ins-section flex-fill" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                                <div class="ins-label">실행 내용</div>
                                <div id="ins-contents-list"
                                    style="flex: 1; background: #1a1a1a; border: 1px solid #444; border-radius: 2px; overflow-y: auto; padding: 6px; font-family: 'Courier New', monospace;">
                                </div>
                            </section>
                        </div>
                    </div>
            </aside>
        </main>
        
        <footer id="statusbar">
            <div class="status-group">
                <label>인스펙터 폰트:</label>
                <input type="range" id="inspector-font-size" min="8" max="16" value="11" style="width: 120px;">
                <span id="font-size-display" style="margin-left: 4px; font-size: 12px; min-width: 30px;">11px</span>
            </div>
            <div class="status-group">
                <span id="map-info">Map000 (0x0)</span>
                <span id="mouse-pos-info">MousePos 0,0</span>
            </div>
        </footer>
    </div>


    <script src="script/EventCommandDef.js"></script>
    <script src="script/EventCodeEditor.js"></script>
